<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>快樂炒股人｜Debug 面板</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/debug.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="debug-shell">
    <header class="debug-topbar">
      <div>
        <p class="eyebrow">DEBUG FINANCE TERMINAL</p>
        <h1>快樂炒股人｜詳細數據面板</h1>
        <p class="subtitle">只讀模式｜觀察股價、恐慌值、熱度、買賣壓與公式計算。</p>
      </div>

      <a class="debug-back-btn" href="/">返回首頁</a>
    </header>

    <section class="debug-searchbar">
      <input id="debugSearch" type="search" placeholder="搜尋股票代號、名稱、產業..." />
      <button id="debugRefreshBtn" type="button">重新整理</button>
    </section>

    <div id="debugStatus" class="debug-status">載入中...</div>

    <section class="debug-market-summary">
      <article>
        <span>股票數</span>
        <strong id="debugSummaryCount">--</strong>
      </article>

      <article>
        <span>上漲 / 下跌</span>
        <strong id="debugSummaryUpDown">--</strong>
      </article>

      <article>
        <span>最強</span>
        <strong id="debugSummaryStrongest">--</strong>
      </article>

      <article>
        <span>最弱</span>
        <strong id="debugSummaryWeakest">--</strong>
      </article>

      <article>
        <span>平均恐慌</span>
        <strong id="debugSummaryPanic">--</strong>
      </article>

      <article>
        <span>平均熱度</span>
        <strong id="debugSummaryHeat">--</strong>
      </article>

      <article>
        <span>總買壓</span>
        <strong id="debugSummaryBuy">--</strong>
      </article>

      <article>
        <span>總賣壓</span>
        <strong id="debugSummarySell">--</strong>
      </article>
    </section>

    <main class="debug-layout">
      <aside class="debug-sidebar">
        <div class="debug-sidebar-title">
          <h2>股票列表</h2>
          <span id="debugStockCount">--</span>
        </div>

        <div id="debugStockList" class="debug-stock-list"></div>
      </aside>

      <section class="debug-finance-page">
        <article class="debug-main-card">
          <div class="debug-stock-title-row">
            <div>
              <p id="debugSector" class="eyebrow">--</p>
              <h2 id="debugTitle">選擇一支股票</h2>
              <p id="debugSubtitle" class="debug-muted">從左側列表選擇股票後，這裡會顯示詳細資訊。</p>
            </div>

            <span id="debugRiskBadge" class="debug-risk risk-normal">--</span>
          </div>

          <div class="debug-price-area">
            <div>
              <div id="debugPrice" class="debug-big-price">--</div>
              <div id="debugChange" class="debug-change-text">--</div>
              <div id="debugUpdateTime" class="debug-muted">--</div>
            </div>
          </div>

          <div class="debug-chart-box">
            <div class="debug-chart-tabs">
              <button class="debug-chart-tab active" type="button" data-debug-chart="intraday">1D 即時</button>
              <button class="debug-chart-tab" type="button" data-debug-chart="candles">30D 收盤</button>
            </div>

            <canvas id="debugPriceChart"></canvas>
          </div>
        </article>

        <section class="debug-section-card">
          <div class="debug-section-heading">
            <h3>Overview</h3>
            <span>主要股價資料</span>
          </div>

          <div id="debugOverviewGrid" class="debug-overview-grid"></div>
        </section>

        <section class="debug-section-card">
          <div class="debug-section-heading">
            <h3>Market Pressure</h3>
            <span>買賣壓與市場情緒</span>
          </div>

          <div class="debug-pressure-grid">
            <div>
              <div class="debug-pressure-label">
                <span>買壓</span>
                <strong id="debugBuyPressure">--</strong>
              </div>
              <div class="debug-bar">
                <i id="debugBuyBar"></i>
              </div>
            </div>

            <div>
              <div class="debug-pressure-label">
                <span>賣壓</span>
                <strong id="debugSellPressure">--</strong>
              </div>
              <div class="debug-bar sell">
                <i id="debugSellBar"></i>
              </div>
            </div>
          </div>

          <div id="debugEmotionGrid" class="debug-emotion-grid"></div>
        </section>

        <section class="debug-section-card">
          <details class="debug-formula-box" open>
            <summary>公式計算說明</summary>
            <div id="debugFormulaList" class="debug-formula-list"></div>
          </details>
        </section>
      </section>
    </main>
  </div>

  <script src="/debug.js"></script>
</body>
</html>
