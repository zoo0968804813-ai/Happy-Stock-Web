<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>快樂炒股人｜Debug 面板</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">DEBUG PANEL</p>
        <h1>快樂炒股人｜Debug 面板</h1>
        <p class="subtitle">如果你看到這個畫面，代表 /debug 頁面已成功載入。</p>
      </div>

      <a class="debug-login-btn" href="/">返回首頁</a>
    </header>

    <section class="summary-grid">
      <article class="metric-card">
        <span>狀態</span>
        <strong>已登入</strong>
      </article>

      <article class="metric-card">
        <span>模式</span>
        <strong>只讀 Debug</strong>
      </article>

      <article class="metric-card">
        <span>資料來源</span>
        <strong>PostgreSQL</strong>
      </article>

      <article class="metric-card">
        <span>API</span>
        <strong>GET Only</strong>
      </article>
    </section>

    <article class="card">
      <h2>Debug 頁面測試成功</h2>
      <p class="subtitle">
        下一步可以再加入股票詳細資訊、恐慌值、買賣壓、公式計算與市場觀察面板。
      </p>
    </article>
  </div>
</body>
</html>
