<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>快樂炒股人｜Debug 面板</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/debug.css" />
</head>
<body>
  <div class="debug-shell">
    <header class="debug-hero">
      <div>
        <p class="eyebrow">DEBUG PANEL</p>
        <h1>快樂炒股人｜詳細數據面板</h1>
        <p class="subtitle">只讀模式，用於觀察股價、恐慌值、熱度、買賣壓與公式計算。</p>
      </div>

      <a class="debug-login-btn" href="/">返回首頁</a>
    </header>

    <section class="debug-toolbar">
      <input id="debugSearch" type="search" placeholder="搜尋股票代號或名稱..." />
      <button id="debugRefreshBtn" type="button">重新整理</button>
    </section>

    <section id="debugStatus" class="debug-status">載入中...</section>

    <section id="debugGrid" class="debug-grid"></section>
  </div>

  <script src="/debug.js"></script>
</body>
</html>
